name: Deploy Mini App to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Забрать файлы
        uses: actions/checkout@v4

      - name: Подготовить Pages
        uses: actions/configure-pages@v5

      - name: Собрать папку web
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
